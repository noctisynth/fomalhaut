[package]
name = "fomalhaut-greetd"
version = "0.1.0-alpha.0"
edition = "2024"
description = "greetd login backend for Fomalhaut"
license.workspace = true
repository.workspace = true

[dependencies]
fomalhaut-core = { version = "0.1.0-alpha.2", path = "../fomalhaut-core" }
greetd_ipc = { version = "0.10.3", features = ["tokio-codec"] }
tokio = { version = "1.53.1", features = ["net"] }
zeroize = "1.9.0"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
