name: Semifold CI
on:
  push:
    branches: [main]

env:
  CLICOLOR_FORCE: 1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
      - name: Install Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Record Bun canary revision
        run: |
          bun --version
          bun --revision
      - name: Semifold CI
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
