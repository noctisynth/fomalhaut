name: Semifold CI
on:
  push:
    branches: [main]

env:
  CLICOLOR_FORCE: 1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Version or Publish
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkitgtk-6.0-dev
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
        with:
          version: v0.3.0-rc.1
      - name: Install Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Record Bun canary revision
        run: |
          bun --version
          bun --revision
      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript SDK
        run: bun run --cwd packages/fomalhaut-sdk build
      - name: Setup Node for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Semifold CI
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
