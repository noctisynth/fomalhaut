name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libclang-dev \
            libgtk4-layer-shell-dev \
            libpam0g-dev \
            libwebkitgtk-6.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Show Bun revision
        run: |
          bun --version
          bun --revision

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Packaging tests
        run: |
          python3 packaging/aur/test_resolve.py
          bash -n packaging/aur/render.sh
          bash -n install.sh

      - name: Check SDK
        run: bun run check:sdk

      - name: SDK tests
        run: bun run --cwd packages/fomalhaut-sdk test

      - name: Build SDK
        run: bun run --cwd packages/fomalhaut-sdk build

      - name: Check Nocturne theme
        run: bun run --cwd themes/nocturne check

      - name: Test Nocturne theme
        run: bun run --cwd themes/nocturne test

      - name: Build Nocturne theme
        run: bun run --cwd themes/nocturne build

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
