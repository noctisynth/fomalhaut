name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkitgtk-6.0-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Record Bun canary revision
        run: |
          bun --version
          bun --revision

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Check generated TypeScript and SDK
        run: bun run check:sdk

      - name: Test TypeScript SDK
        run: bun run --cwd packages/fomalhaut-sdk test

      - name: Build TypeScript SDK
        run: bun run --cwd packages/fomalhaut-sdk build

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
