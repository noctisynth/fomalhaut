name: Semifold Status
on:
  pull_request:
    branches: [main]

env:
  CLICOLOR_FORCE: 1

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
      - name: Install Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Record Bun canary revision
        run: |
          bun --version
          bun --revision
      - name: Semifold Status
        run: semifold status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
